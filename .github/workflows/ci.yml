# WordPress CI — Stage D of the engineering-standardisation roadmap.
#
# Automates the Stage C static quality system (docs/engineering-standard.md
# §1.7; docs/development.md "Continuous integration (Stage D)"). This
# workflow does NOT reimplement that system: it installs the committed
# lockfile and calls the repository's existing commands.
#
# Blocking gates (a non-zero exit fails the job):
#   1. composer validate --strict  — composer.json/lock consistency
#   2. composer install            — from composer.lock, never `update`
#   3. ./scripts/lint.sh           — PHP syntax + PHPCS no-new-violations
#                                    + PHPStan level 5 (the Stage C gate)
#   4. shellcheck scripts/*.sh     — repository shell scripts
#
# Non-blocking by design (telemetry only, never gates the run):
#   composer lint — the RAW legacy PHPCS debt view. It is red by design while
#   the recorded debt in phpcs-baseline.json exists (Stage C measured 3290
#   errors + 2672 warnings across 151 files). The objective is "legacy debt
#   must not grow", not "legacy debt is already zero", so this step is
#   explicitly continue-on-error and clearly labelled. It never writes the
#   baseline, never commits, never mutates source.
#
# This workflow is read-only and offline with respect to production: it
# contacts only the package registry to install dev dependencies. It never
# connects to conexaobr.ie, WordPress.com, a database, the REST API, or
# Polylang, and it requires no repository secrets.

name: WordPress CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only: Stage D needs no write scopes.
permissions:
  contents: read

# Superseded runs for the same ref are cancelled; refs are independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static quality (lint.sh + ShellCheck)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # PHP 8.5 — the same toolchain PHP Stage C was verified on (8.5.8).
          # The declared compatibility FLOOR is unchanged (8.0, phpcs
          # testVersion: 8.0-); this stage does not alter that policy.
          php-version: '8.5'
          # Composer is pinned to v2 to match the committed lockfile's
          # plugin API (composer-plugin-api ^2.2) and Stage C's Composer 2.10.
          tools: composer:v2

      - name: Report environment
        run: |
          php --version
          composer --version

      # Composer *download* cache only, keyed on the committed lockfile, so a
      # changed lockfile invalidates it. This never caches vendor/, WordPress
      # runtime state, credentials or database contents, and it can never
      # replace the install: the install below runs on every run.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-downloads-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-downloads-${{ runner.os }}-

      - name: Validate composer.json and composer.lock
        run: composer validate --strict --no-interaction

      - name: Install dependencies from composer.lock
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Assert the lockfile was not modified
        run: |
          if ! git diff --quiet -- composer.json composer.lock; then
            echo "::error::composer.json/composer.lock changed during CI — the lockfile must stay committed and untouched."
            git diff -- composer.json composer.lock
            exit 1
          fi

      - name: Quality gate — ./scripts/lint.sh
        run: ./scripts/lint.sh

      - name: ShellCheck
        # setup-php does not provide ShellCheck; the runner image does, but
        # its presence is not a documented guarantee, so install it
        # explicitly via the maintained apt package.
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck --version
          shellcheck scripts/*.sh

      - name: Telemetry (non-blocking) — raw legacy PHPCS debt
        if: always()
        continue-on-error: true
        run: |
          echo "### Raw legacy PHPCS debt (informational, non-blocking)" >&2
          echo "This is the raw view of the pre-Stage-C debt recorded in" >&2
          echo "phpcs-baseline.json. The blocking gate above is" >&2
          echo "./scripts/lint.sh, which fails on NEW violations only." >&2
          composer lint || echo "::warning::Raw PHPCS debt is non-zero by design (legacy baseline, Stage C). Not a CI failure." >&2

  # ---------------------------------------------------------------------
  # Stage E — Docker/WordPress integration job.
  #
  # Runs the shared test harness (scripts/run-tests.sh): the in-process PHP
  # suites and the HTTP acceptance suites against a LOCAL, EPHEMERAL
  # WordPress. The Stage D static-quality job above is unchanged; this job
  # owns the two-layer test contract and nothing else.
  #
  # Safety:
  #   - no production host, no production credentials, no repository secrets;
  #   - the database is an ephemeral CI-local container, destroyed on cleanup;
  #   - CONEXAO_TEST_BASE_URL is an explicit local URL and the harness itself
  #     refuses any production host (tests/acceptance/lib/http_client.py);
  #   - no continue-on-error on the test step: a real failure fails the job.
  # ---------------------------------------------------------------------
  integration:
    name: Integration tests (Docker WordPress + run-tests.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # The CI-local WordPress. Never a production host.
      CONEXAO_TEST_BASE_URL: http://localhost:8080
      # Pinned third-party dependency, per docs/development.md and the Stage 2
      # report. Not "latest".
      POLYLANG_VERSION: 3.8.9

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start the local WordPress stack (ephemeral)
        run: docker compose up -d

      - name: Wait for WordPress to be ready
        # An actual readiness check, not `sleep 10`: poll the front page until
        # it serves a 200 (or a redirect to the installer, which still proves
        # PHP + MySQL are answering). Also require the DB healthcheck.
        run: |
          set -euo pipefail
          # 1. Database healthy.
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q db)" 2>/dev/null)" = "healthy" ]; then
              echo "db healthy"
              break
            fi
            if [ "$i" -eq 60 ]; then echo "::error::database never became healthy"; docker compose logs db; exit 1; fi
            sleep 2
          done
          # 2. HTTP serving.
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8080/ || true)"
            case "$code" in
              200|301|302)
                echo "WordPress is serving (status $code)"
                exit 0
                ;;
            esac
            sleep 2
          done
          echo "::error::WordPress did not become ready"
          docker compose logs wordpress
          exit 1

      - name: Install WordPress (WP-CLI, single site, no prompts)
        run: |
          set -euo pipefail
          docker run --rm --network container:wordpress-website-wordpress-1 \
            -v "$PWD:/var/www/html-src" --entrypoint wp wordpress:cli \
            core install --path=/var/www/html --url=http://localhost:8080 \
            --title="Conexao BR Ireland (CI)" --admin_user=ci --admin_password=ci \
            --admin_email=ci@example.invalid --skip-email

      - name: Activate the repository theme and plugins
        run: |
          set -euo pipefail
          wp() {
            docker run --rm --network container:wordpress-website-wordpress-1 \
              -v "$PWD:/var/www/html-src" --entrypoint wp wordpress:cli "$@"
          }
          wp theme activate conexao-br-irlanda
          # The repository's own plugins, mounted by compose.yaml.
          for slug in conexao-data-model conexao-content conexao-event-runtime \
                      conexao-admin-ux conexao-event-importer conexao-leisure-migration \
                      conexao-sponsor-migration; do
            wp plugin activate "$slug"
          done
          # Polylang Free, pinned version. Third-party, installed (not vendored).
          wp plugin install polylang --version="$POLYLANG_VERSION" --force
          wp plugin activate polylang
          wp plugin list

      - name: Report the test environment
        run: |
          set -euo pipefail
          docker compose ps
          curl -s -o /dev/null -w 'front page: %{http_code}\n' http://localhost:8080/

      # PHASE 50: the runner owns discovery. The job never hardcodes suite names.
      - name: Run the shared test harness
        run: ./scripts/run-tests.sh

      - name: Teardown (never masks the test exit status)
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
