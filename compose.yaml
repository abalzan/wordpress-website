services:
  db:
    image: mysql:latest
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-local-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
      # Local DB must match the utf8mb4 charset/collation used by the restore
      # script (scripts/restore-updraft-db.sh). Never set these to latin1.
      WORDPRESS_DB_CHARSET: utf8mb4
      WORDPRESS_DB_COLLATION: utf8mb4_unicode_ci
    entrypoint: ["/usr/local/bin/entrypoint-fix-permissions.sh"]
    volumes:
      - wordpress_data:/var/www/html
      - ./.htaccess:/var/www/html/.htaccess:ro
      - ./wp-content/themes/conexao-br-irlanda:/var/www/html/wp-content/themes/conexao-br-irlanda
      # BEGIN GENERATED PLUGIN REGISTRY: plugin mounts
      # Source of truth: plugins.json (mount: true), in load order. Do not edit by hand.
      # Regenerate: php scripts/generate-registry-docs.php --write
      - ./wp-content/plugins/conexao-data-model:/var/www/html/wp-content/plugins/conexao-data-model
      - ./wp-content/plugins/conexao-content:/var/www/html/wp-content/plugins/conexao-content
      - ./wp-content/plugins/conexao-admin-ux:/var/www/html/wp-content/plugins/conexao-admin-ux
      - ./wp-content/plugins/conexao-event-runtime:/var/www/html/wp-content/plugins/conexao-event-runtime
      - ./wp-content/plugins/conexao-event-importer:/var/www/html/wp-content/plugins/conexao-event-importer
      - ./wp-content/plugins/conexao-leisure-migration:/var/www/html/wp-content/plugins/conexao-leisure-migration
      - ./wp-content/plugins/conexao-sponsor-migration:/var/www/html/wp-content/plugins/conexao-sponsor-migration
      - ./wp-content/plugins/conexao-translation-rollout:/var/www/html/wp-content/plugins/conexao-translation-rollout
      - ./wp-content/plugins/conexao-page-translation:/var/www/html/wp-content/plugins/conexao-page-translation
      - ./wp-content/plugins/conexao-blog-translation:/var/www/html/wp-content/plugins/conexao-blog-translation
      - ./wp-content/plugins/conexao-job-translation:/var/www/html/wp-content/plugins/conexao-job-translation
      - ./wp-content/plugins/conexao-leisure-translation:/var/www/html/wp-content/plugins/conexao-leisure-translation
      - ./wp-content/plugins/conexao-guide-translation:/var/www/html/wp-content/plugins/conexao-guide-translation
# END GENERATED PLUGIN REGISTRY: plugin mounts
      - ./docker/apache-allowoverride.conf:/etc/apache2/conf-enabled/apache-allowoverride.conf:ro
      - ./docker/entrypoint-fix-permissions.sh:/usr/local/bin/entrypoint-fix-permissions.sh:ro
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/zz-conexao-uploads.ini:ro
      - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins
      # Stage E test harness (dev-only mounts). The shared bootstrap is the
      # only place allowed to locate wp-load.php, so the WordPress container
      # needs the repository's tests/ and scripts/ trees to execute suites.
      # These are development/test assets and are never part of a release ZIP.
      - ./tests:/var/www/html/tests
      - ./scripts:/var/www/html/scripts

volumes:
  db_data:
  wordpress_data:
