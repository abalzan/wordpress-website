; Local development PHP limits (mounted into /usr/local/etc/php/conf.d/)
; Raises the defaults from the official WordPress image so large export
; files (events JSON, Lazer ZIP) can be uploaded through wp-admin.
; Production equivalents are managed by the hosting platform (WordPress.com).

upload_max_filesize = 300M
post_max_size = 300M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300